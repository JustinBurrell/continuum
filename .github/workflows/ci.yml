name: CI

# Runs on every push to any branch and on every PR targeting main.
# Failing tests will block a PR from being merged (once branch protection is configured).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # mongodb-memory-server downloads a MongoDB binary on first run.
      # Caching it avoids ~30s download on every CI run.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-real
          FRONTEND_URL: http://localhost:5173
          GOOGLE_CLIENT_ID: ci-test-google-client-id
          GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
          RESEND_API_KEY: ci-test-resend-key
          GROQ_API_KEY: ci-test-groq-key
          CLOUDINARY_CLOUD_NAME: ci-test-cloud
          CLOUDINARY_API_KEY: ci-test-cloudinary-key
          CLOUDINARY_API_SECRET: ci-test-cloudinary-secret
        run: npm test

  playwright:
    name: Playwright E2E (web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers and deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: web
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-real
          FRONTEND_URL: http://localhost:5173
          GOOGLE_CLIENT_ID: ci-test-google-client-id
          GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
          RESEND_API_KEY: ci-test-resend-key
          GROQ_API_KEY: ci-test-groq-key
          CLOUDINARY_CLOUD_NAME: ci-test-cloud
          CLOUDINARY_API_KEY: ci-test-cloudinary-key
          CLOUDINARY_API_SECRET: ci-test-cloudinary-secret
          VITE_API_URL: http://localhost:5001
        run: npx playwright test

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create stub google-services.json for CI
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "continuum-ci-placeholder",
              "storage_bucket": "continuum-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.continuum.android" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Upload Android test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
